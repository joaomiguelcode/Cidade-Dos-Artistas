<html>
    <body> 
        <audio id="music" autoplay loop>
            <source src="music2.mp3" type="audio/mpeg">
        </audio>
        <div style="position: fixed; top: 0; left: 0; width: 100%; height: 100%">
            <video
              id="video"
              style="width: 100%; height: 100%; object-fit: cover"
              autoplay
              loop
              muted
            >
              <source type="video/mp4" src="http://181.215.236.140/loading/loadscreen.mp4" />
            </video>
          </div>
        <script type="text/javascript">
            var music = document.getElementById("music");
            music.volume = 0.2;
            document.onkeydown = function(data) {
            switch (data.keyCode){
                case 32:
                    if(music.paused){
                        music.play();
                    } else {
                        music.pause();
                    }
                    break
                case 38:
                    music.volume += 0.1
                    break
                case 40:
                    music.volume -= 0.1
                    break
                }
            };
        </script>
        <div style="margin-top: 3vh; text-align: center">
            <span>[ ↑ / ↓ ] Volume - [ESPAÇO] Pause/Play</span>
        </div>
    </body>
</html>
